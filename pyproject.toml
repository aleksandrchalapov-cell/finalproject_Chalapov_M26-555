[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "Console platform for tracking and simulating currency trading"
readme = "README.md"
authors = [
    { name = "Aleksandr Chalapov", email = "268932756+aleksandrchalapov-cell@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
